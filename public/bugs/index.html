<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Chucky · Bug queue</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root{--bg:#100e09;--pane:#17150f;--line:rgba(244,236,221,.14);--ink:#F4ECDD;--dim:#8F8676;--red:#F0616B;--grn:#7BC96F;--amb:#E7B84F;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--mono);padding:26px 20px 80px}
button{font:inherit}
.wrap{max-width:820px;margin:0 auto}
header{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
h1{font-size:20px;margin:0;letter-spacing:.02em}
.cat{font-size:22px}
.home{margin-left:auto;font-size:12px;color:var(--dim);text-decoration:none}
.home:hover{color:var(--ink)}
.sub{color:var(--dim);font-size:12.5px;margin:2px 0 20px;line-height:1.5}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
.bar button{font-size:12px;line-height:1;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:8px;padding:7px 12px;cursor:pointer}
.bar button:hover{border-color:var(--red)}
.bar .filt[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}
.count{color:var(--dim);font-size:12px;margin-left:auto}
.card{background:var(--pane);border:1px solid var(--line);border-radius:13px;padding:15px 16px;margin-bottom:13px;display:flex;gap:14px}
.card .body{flex:1;min-width:0}
.top{display:flex;align-items:center;gap:9px;margin-bottom:7px;flex-wrap:wrap}
.pill{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;padding:3px 8px;border-radius:999px;font-weight:600}
.p-new{background:rgba(240,97,107,.16);color:var(--red)}
.p-fixed{background:rgba(123,201,111,.16);color:var(--grn)}
.p-auth{background:rgba(231,184,79,.16);color:var(--amb)}
.p-triaged{background:rgba(143,134,118,.18);color:var(--dim)}
.ed{font-size:11.5px;color:var(--dim)}
.when{font-size:11px;color:var(--dim);margin-left:auto}
.desc{font-size:13.5px;line-height:1.5;white-space:pre-wrap;word-break:break-word;margin:2px 0 8px}
.note{font-size:12px;line-height:1.5;color:var(--ink);background:#0f0d08;border-left:2px solid var(--grn);border-radius:0 7px 7px 0;padding:8px 11px;margin-top:8px;white-space:pre-wrap}
.note.auth{border-color:var(--amb)}
.meta{font-size:11px;color:var(--dim);word-break:break-all}
.meta a{color:var(--red);text-decoration:none}
.meta a:hover{text-decoration:underline}
.shot{width:132px;flex:none}
.shot img{width:132px;border-radius:8px;border:1px solid var(--line);display:block;cursor:zoom-in}
.shot .no{width:132px;height:88px;border:1px dashed var(--line);border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--dim);font-size:10.5px;text-align:center}
.acts{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}
.acts button{font-size:11px;line-height:1;border:1px solid var(--line);background:transparent;color:var(--dim);border-radius:7px;padding:6px 10px;cursor:pointer}
.acts button:hover{color:var(--ink);border-color:var(--ink)}
.empty{color:var(--dim);text-align:center;padding:60px 0;font-size:13px;line-height:1.6}
.empty b{color:var(--ink);font-weight:500}
.lay{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;align-items:center;justify-content:center;z-index:9;padding:20px;cursor:zoom-out}
.lay.on{display:flex}
.lay img{max-width:96vw;max-height:92vh;border-radius:10px}
@media(max-width:560px){.card{flex-direction:column-reverse}.shot,.shot img,.shot .no{width:100%}.shot .no{height:48px}}
</style>
</head>
<body>
<div class="wrap">
<header><span class="cat" aria-hidden="true">🐱</span><h1>Chucky · Bug queue</h1><a class="home" href="/chucky/">editors ↗</a></header>
<div class="sub">Reports from the menu editors land here. Low-risk fixes get shipped and marked <b style="color:var(--grn)">fixed</b>; anything that needs a judgment call is marked <b style="color:var(--amb)">needs&nbsp;auth</b> with a proposed fix for you to approve.</div>
<div class="bar">
  <button class="filt" data-f="all" aria-pressed="true">All</button>
  <button class="filt" data-f="new" aria-pressed="false">New</button>
  <button class="filt" data-f="needs-auth" aria-pressed="false">Needs auth</button>
  <button class="filt" data-f="fixed" aria-pressed="false">Fixed</button>
  <button id="refresh">↻ Refresh</button>
  <button id="rekey">Key</button>
  <span class="count" id="count" aria-live="polite"></span>
</div>
<div id="list"></div>
</div>
<div class="lay" id="lay"><img id="layimg" alt="Bug report snapshot, full size"></div>
<script>
(function () {
  const KEY_STORE = 'chucky_bugkey';
  let KEY = '', FILTER = 'all', BUGS = [];
  try { KEY = localStorage.getItem(KEY_STORE) || ''; } catch { /* storage blocked */ }
  const $ = (s) => document.querySelector(s);
  const list = $('#list');

  function askKey() {
    const k = prompt('Enter the bug-queue key (BUG_KEY):', KEY || '');
    if (k === null) return false;
    KEY = k.trim();
    try { localStorage.setItem(KEY_STORE, KEY); } catch { /* storage blocked: key lasts for this page only */ }
    return true;
  }
  const auth = () => ({ authorization: 'Bearer ' + KEY });

  /* Every field below arrives from POST /api/bug, which is public — treat all of it as hostile.
     esc() covers quotes too: a value inside an attribute must not be able to close it and inject a
     handler into the page that holds BUG_KEY. */
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"'`]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;', '`': '&#96;' }[c]));
  // a snapshot must be an inline raster image and nothing else
  const safeShot = (s) => (typeof s === 'string' && /^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=]+$/.test(s) ? s : null);
  // editor links must be absolute http(s); never resolved against this page's origin
  const safeUrl = (u) => {
    if (typeof u !== 'string' || !u) return null;
    try { const x = new URL(u); return x.protocol === 'http:' || x.protocol === 'https:' ? x.href : null; } catch { return null; }
  };
  const ago = (t) => {
    const s = (Date.now() - t) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.floor(s / 60) + 'm ago';
    if (s < 86400) return Math.floor(s / 3600) + 'h ago';
    return Math.floor(s / 86400) + 'd ago';
  };
  const PILLS = { new: ['p-new', 'new'], fixed: ['p-fixed', 'fixed'], 'needs-auth': ['p-auth', 'needs auth'], triaged: ['p-triaged', 'triaged'] };
  const pill = (st) => { const [cls, label] = PILLS[st] || ['p-triaged', st]; return `<span class="pill ${cls}">${esc(label)}</span>`; };
  const message = (html) => { list.innerHTML = `<div class="empty">${html}</div>`; $('#count').textContent = ''; };

  async function load() {
    if (!KEY) { message('Enter the bug-queue key to see reports. Click <b>Key</b>.'); return; }
    message('Loading…');
    let res, body;
    try {
      res = await fetch('/api/bugs', { headers: auth(), cache: 'no-store' });
      body = await res.json().catch(() => ({}));
    } catch { message('Could not reach the API.'); return; }
    if (res.status === 403) { message('Wrong key. Click <b>Key</b> to re-enter it.'); return; }
    if (res.status === 503) { message('The bug queue’s storage isn’t connected yet.<br>Connect Upstash Redis to this project (see README).'); return; }
    if (!res.ok) { message('The API answered ' + res.status + (body.error ? ': ' + esc(body.error) : '') + '.'); return; }
    BUGS = body.bugs || [];
    render();
  }

  function render() {
    const rows = BUGS.filter((b) => FILTER === 'all' || b.status === FILTER);
    if (!rows.length) { message('Nothing here. 🐟'); $('#count').textContent = `0 of ${BUGS.length}`; return; }
    $('#count').textContent = `${rows.length} of ${BUGS.length}`;
    list.innerHTML = rows.map((b) => {
      const shot = safeShot(b.shot);
      const url = safeUrl(b.url);
      const page = Number.isFinite(b.page) ? ' · p' + b.page : '';
      const note = b.resolution
        ? `<div class="note ${b.status === 'needs-auth' ? 'auth' : ''}">${b.status === 'needs-auth' ? '⚠︎ Proposed fix — needs your OK\n' : '✓ '}${esc(b.resolution)}</div>` : '';
      return `<div class="card">
        <div class="body">
          <div class="top">${pill(b.status)}<span class="ed">${esc(b.editor || '?')}${page}</span><span class="when">${ago(b.t)}</span></div>
          <div class="desc">${esc(b.desc)}</div>
          ${url ? `<div class="meta"><a href="${esc(url)}" target="_blank" rel="noopener noreferrer">open editor ↗</a></div>` : ''}
          ${note}
          <div class="acts">
            ${b.status === 'needs-auth' ? `<button data-act="approve" data-id="${esc(b.id)}">✓ Approve fix</button>` : ''}
            ${b.status !== 'fixed' ? `<button data-act="fixed" data-id="${esc(b.id)}">Mark fixed</button>` : ''}
            ${b.status !== 'new' ? `<button data-act="new" data-id="${esc(b.id)}">Reopen</button>` : ''}
          </div>
        </div>
        <div class="shot">${shot ? `<img src="${esc(shot)}" alt="Preview snapshot">` : `<div class="no">${b.shot ? 'snapshot rejected' : 'no snapshot'}</div>`}</div>
      </div>`;
    }).join('');
  }

  document.addEventListener('click', async (e) => {
    const f = e.target.closest('.filt');
    if (f) {
      document.querySelectorAll('.filt').forEach((x) => x.setAttribute('aria-pressed', x === f));
      FILTER = f.dataset.f; render(); return;
    }
    const img = e.target.closest('.shot img');
    if (img) { $('#layimg').src = img.src; $('#lay').classList.add('on'); return; }
    if (e.target.closest('#lay')) { $('#lay').classList.remove('on'); return; }
    const a = e.target.closest('.acts button');
    if (a) {
      a.disabled = true; a.textContent = '…';
      const patch = a.dataset.act === 'approve' ? { status: 'new', approved: true } : { status: a.dataset.act };
      try {
        const res = await fetch('/api/bug/' + encodeURIComponent(a.dataset.id), {
          method: 'PATCH', headers: { 'content-type': 'application/json', ...auth() }, body: JSON.stringify(patch),
        });
        if (!res.ok) alert('Could not update the report (server said ' + res.status + ').');
      } catch { alert('Could not reach the API.'); }
      load();
    }
  });
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') $('#lay').classList.remove('on'); });
  $('#refresh').addEventListener('click', load);
  $('#rekey').addEventListener('click', () => { if (askKey()) load(); });

  if (!KEY) askKey();
  load();
  setInterval(() => { if (!document.hidden && KEY) load(); }, 60000);
})();
</script>
</body>
</html>
